name: CI

# Quality gates on every PR and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt in to Node 24 for the JS actions used below (checkout etc.) ahead of
  # the 2026-06-16 default flip + the 2026-09-16 Node 20 removal. Keeps the
  # pinned action versions working until upstream ships a major bump.
  # See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    # prisma.config.ts resolves env('DIRECT_URL') at load time, and turbo re-runs
    # `prisma generate` (the @gabee/db build) as a ^build dependency of typecheck
    # and test. `generate` never connects, so a throwaway URL satisfies all steps.
    env:
      DIRECT_URL: postgresql://prisma:prisma@localhost:5432/prisma
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so typecheck/test can resolve @gabee/db types.
      - name: Prisma generate
        run: pnpm --filter @gabee/db run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
