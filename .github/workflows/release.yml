name: Release

# Tag-driven production deploy. Create a tag to ship:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io/iamvaln
  # Opt in to Node 24 for the JS actions below (checkout, docker/*) ahead of
  # the 2026-06-16 default flip + the 2026-09-16 Node 20 removal. Lets us
  # leave action versions pinned (v4 / v3 / v6) until each maintainer ships a
  # major bump — the runner just runs the existing entrypoint on Node 24.
  # See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Build & push the web image (Next.js) ────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_KID_APP_URL=${{ vars.NEXT_PUBLIC_KID_APP_URL }}
            NEXT_PUBLIC_PARENT_APP_URL=${{ vars.NEXT_PUBLIC_PARENT_APP_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=gabee-web
            SENTRY_RELEASE=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/gabee-web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/gabee-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ── Build & push the kid image (static PWA) ─────────────────────────────────
  build-kid:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push kid
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/kid/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_VERSION=${{ github.ref_name }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=gabee-kids
            SENTRY_RELEASE=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/gabee-kid:${{ github.ref_name }}
            ${{ env.REGISTRY }}/gabee-kid:latest
          cache-from: type=gha,scope=kid
          cache-to: type=gha,scope=kid,mode=max

  # ── Build & push the backup sidecar image (pg_dump → R2) ────────────────────
  # docker-compose.yml references gabee-backup:${IMAGE_TAG}; the VPS `compose
  # pull` fails if this tag isn't in GHCR, so it must ship with every release.
  build-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backup
        uses: docker/build-push-action@v6
        with:
          context: ./ops/backup
          push: true
          tags: |
            ${{ env.REGISTRY }}/gabee-backup:${{ github.ref_name }}
            ${{ env.REGISTRY }}/gabee-backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

  # ── Build & push the cron-digest sidecar image ──────────────────────────────
  # docker-compose.yml references gabee-cron-digest:${IMAGE_TAG}; same
  # reasoning as the backup image — must exist in GHCR before `compose pull`.
  build-cron-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push cron-digest
        uses: docker/build-push-action@v6
        with:
          context: ./ops/cron-digest
          push: true
          tags: |
            ${{ env.REGISTRY }}/gabee-cron-digest:${{ github.ref_name }}
            ${{ env.REGISTRY }}/gabee-cron-digest:latest
          cache-from: type=gha,scope=cron-digest
          cache-to: type=gha,scope=cron-digest,mode=max

  # ── Security backstop: deterministic scanners gate the deploy ────────────────
  # Same tiers as `pnpm security:scan`, enforced on every v* tag. A block-tier
  # finding here fails the release before the SSH deploy step runs. AI review +
  # dynamic probes are Plan 2; this job is the static deterministic core.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — gitleaks scans commits, not just the tree
      - name: gitleaks (secrets — block)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: osv-scanner (dependency CVEs)
        # The step-action lives in a subdirectory; the repo root at v1.9.x has no
        # top-level `runs:` (it's a reusable-workflow repo). The `@v1` tag never existed.
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: "--lockfile=pnpm-lock.yaml"
      - name: Semgrep (SAST — ERROR blocks)
        # `semgrep/semgrep-action` is deprecated; run the CLI directly, matching
        # scan.sh's tier exactly. `--error` alone only sets the exit code on ANY
        # finding — `--severity ERROR` is required so advisory WARNING rules + the
        # broad p/* rulesets don't fail the gate. Install via pipx (preinstalled on
        # the runner) — a bare `pip install` fails PEP 668 on ubuntu-latest 24.04.
        run: |
          pipx install semgrep
          semgrep scan --error --severity ERROR --quiet \
            --config .semgrep/gabee.yml --config p/typescript --config p/nextjs
      - name: Trivy (compose/IaC misconfig — CRITICAL/HIGH block)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: config
          scan-ref: docker-compose.yml
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ── Deploy: SSH to the VPS, pull the freshly-pushed tag, restart ────────────
  deploy:
    needs: [build-web, build-kid, build-backup, build-cron-digest, security]
    runs-on: ubuntu-latest
    environment: production # optional manual-approval gate (configure in repo settings)
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -euo pipefail
            cd "${APP_DIR:-$HOME/gabee}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            git fetch --tags origin
            git checkout "$IMAGE_TAG"   # sync docker-compose.yml to the released tag
            # Retry the pull: containerd's overlayfs snapshotter intermittently
            # fails cold layer extraction ('link'/'Lchown … no such file or
            # directory') — a parallel-unpack race, not a real error. daemon.json
            # sets max-concurrent-downloads=1 to reduce it; this retry absorbs any
            # residual flake so the deploy self-heals instead of needing a rerun.
            n=0
            until docker compose --env-file .env.production pull; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "compose pull failed after $n attempts"; exit 1; fi
              echo "pull attempt $n hit a transient containerd extract error — retrying in 10s…"
              sleep 10
            done
            docker compose --env-file .env.production up -d
            # Refresh the LOCAL `:latest` tags too. CI tags every release as
            # both :vX.Y.Z and :latest in GHCR, but the compose pull above
            # only fetches :$IMAGE_TAG. Without this, ad-hoc commands like
            # `docker compose run --rm cron-digest run` (no IMAGE_TAG in the
            # shell) fall back to a stale local :latest from a previous
            # release. Quietly skip any image not yet published (first deploy
            # of a new service).
            for image in gabee-web gabee-kid gabee-backup gabee-cron-digest; do
              docker pull "ghcr.io/iamvaln/${image}:latest" || true
            done
            docker logout ghcr.io
            # Prune old release images so tagged :vX.Y.Z versions don't pile up
            # on the VPS — `docker image prune -f` only removes DANGLING images,
            # never old tags, so every release used to accumulate (hit ~200
            # images / ~100GB before the 2026-07-22 cleanup). Keep the 2 most
            # recent versions per image (current + previous, for rollback);
            # :latest and any running image are untouched.
            for image in gabee-web gabee-kid gabee-backup gabee-cron-digest; do
              docker images "ghcr.io/iamvaln/${image}" --format '{{.Tag}}' \
                | grep -E '^v[0-9]' | sort -V | head -n -2 \
                | while read -r tag; do docker rmi "ghcr.io/iamvaln/${image}:${tag}" 2>/dev/null || true; done
            done
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
