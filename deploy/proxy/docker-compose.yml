# Shared reverse proxy for the whole VPS — ONE instance, many projects.
# Every project's compose stack joins the external `web` network and declares
# Traefik labels; Traefik discovers them via the Docker socket and issues a
# Let's Encrypt certificate per hostname automatically.
#
# First-time setup (run once on the VPS):
#   docker network create web
#   cd deploy/proxy && cp .env.example .env   # set ACME_EMAIL
#   docker compose up -d
name: proxy

services:
  traefik:
    # v3.7+ required for Docker 29+ (older Traefik pings the daemon at API 1.24,
    # which Docker 29 rejects: "client version 1.24 is too old").
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      # Discover containers via Docker labels (opt-in per container).
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web
      # HTTP :80 → redirect everything to HTTPS.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # HTTPS :443
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via TLS-ALPN challenge (no extra ports needed).
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      # A SECOND resolver, DNS-01 via Cloudflare — for hostnames that sit
      # BEHIND Cloudflare's proxy (the orange cloud).
      #
      # Why a second one rather than changing `le`: the TLS-ALPN challenge above
      # needs the ACME server to reach *this* Traefik over TLS. Behind the orange
      # cloud, Cloudflare terminates TLS itself, so the challenge never arrives
      # and renewal fails — silently, sixty days later, on a host that had been
      # working for weeks. DNS-01 proves ownership through a TXT record instead,
      # so nothing has to reach the origin at all.
      #
      # Separate storage file: `le` keeps its own acme.json untouched, and
      # removing these four lines restores the previous state exactly.
      #
      # Opt-in per service: a container uses this only by asking for
      # `certresolver=le-dns` in its labels. Nothing changes for those that
      # don't — gabee's own hosts keep TLS-ALPN.
      - --certificatesresolvers.le-dns.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le-dns.acme.storage=/letsencrypt/acme-dns.json
      - --certificatesresolvers.le-dns.acme.dnschallenge=true
      - --certificatesresolvers.le-dns.acme.dnschallenge.provider=cloudflare
      # - --api.dashboard=true   # uncomment + add a router if you want the dashboard
    environment:
      # Only the `le-dns` resolver reads it. Absent or empty, `le` keeps working
      # exactly as before — only a service asking for `le-dns` would fail.
      # Scope the token to Zone:DNS:Edit on the zones that use it, nothing else.
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks: [web]

volumes:
  traefik-acme:

networks:
  web:
    external: true
