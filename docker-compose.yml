# Gabee — production stack (one project among others on a shared VPS).
# Routing/TLS is handled by the shared Traefik proxy on the external `web`
# network (see deploy/proxy/). Bring this stack up with:
#   docker compose --env-file .env.production up -d --build
name: gabee

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gabee-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  # ── One-shot: apply Prisma migrations, then exit. ───────────────────────────
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${REGISTRY:-ghcr.io/iamvaln}/gabee-web:${IMAGE_TAG:-latest}
    env_file: .env.production
    command: ['pnpm', '--filter', '@gabee/db', 'exec', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # ── Next.js: landing + parent portal + admin + /api ─────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_KID_APP_URL: ${NEXT_PUBLIC_KID_APP_URL}
        NEXT_PUBLIC_PARENT_APP_URL: ${NEXT_PUBLIC_PARENT_APP_URL}
    image: ${REGISTRY:-ghcr.io/iamvaln}/gabee-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal, web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Same Next.js process serves apex (landing), parents.* (parent dashboard),
      # admin.* (back office) and api.* (REST). The middleware in `proxy.ts`
      # gates each path by host so cross-surface URLs 404 cleanly.
      - traefik.http.routers.gabee-web.rule=Host(`${WEB_DOMAIN}`) || Host(`www.${WEB_DOMAIN}`) || Host(`parents.${WEB_DOMAIN}`) || Host(`admin.${WEB_DOMAIN}`) || Host(`api.${WEB_DOMAIN}`)
      - traefik.http.routers.gabee-web.entrypoints=websecure
      - traefik.http.routers.gabee-web.tls.certresolver=le
      - traefik.http.services.gabee-web.loadbalancer.server.port=3000

  # ── DB backup sidecar: nightly pg_dump → Cloudflare R2 ──────────────────────
  # Default mode is the long-running scheduler (loop). Restore + one-off
  # backups are imperative — see docs/backups.md. Lives on the internal net
  # only; never exposed via Traefik.
  backup:
    build:
      context: ./ops/backup
    image: ${REGISTRY:-ghcr.io/iamvaln}/gabee-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_PREFIX: ${R2_PREFIX:-backups}
      # AWS SDK reads creds from these names; we map the R2_* env vars onto
      # them here so the user-facing names stay R2-flavoured.
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      BACKUP_SCHEDULE_HOUR_UTC: ${BACKUP_SCHEDULE_HOUR_UTC:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # ── Classification-digest cron sidecar ─────────────────────────────────────
  # Pokes /api/cron/classification-digest once a day. The endpoint reads
  # notification_prefs, dedupes per-parent cadence, and emails the parents
  # who have pending classifications. The sidecar is intentionally dumb —
  # all the logic lives in the Next service so it's TypeScript + typed
  # against the same DB layer the rest of the app uses.
  cron-digest:
    build:
      context: ./ops/cron-digest
    image: ${REGISTRY:-ghcr.io/iamvaln}/gabee-cron-digest:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Internal: stays on the internal network, so we hit the `web`
      # service directly without round-tripping through Traefik. Path
      # mirrors the API route.
      CRON_DIGEST_URL: http://web:3000/api/cron/classification-digest
      CRON_SECRET: ${CRON_SECRET}
      CRON_DIGEST_HOUR_UTC: ${CRON_DIGEST_HOUR_UTC:-9}
    depends_on:
      web:
        condition: service_started
    networks: [internal]

  # ── Kid PWA (static, served by nginx) ───────────────────────────────────────
  kid:
    build:
      context: .
      dockerfile: apps/kid/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: ${REGISTRY:-ghcr.io/iamvaln}/gabee-kid:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.gabee-kid.rule=Host(`${KID_DOMAIN}`)
      - traefik.http.routers.gabee-kid.entrypoints=websecure
      - traefik.http.routers.gabee-kid.tls.certresolver=le
      - traefik.http.services.gabee-kid.loadbalancer.server.port=80

volumes:
  gabee-db:

networks:
  internal: # private: db ↔ web/migrate only
  web: # shared proxy network (created once: `docker network create web`)
    external: true
