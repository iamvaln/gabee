server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every navigation falls back to index.html (the service worker also
    # handles offline navigations once installed).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets Vite emits.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry HTML or the service worker, so new deploys propagate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
